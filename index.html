<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查理的洞穴</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    正文 { 字体族: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", 无衬线字体; 背景: #f5f5f5; 最小高度: 100视口高度; }
    .header { 背景: #1a1a2e; 颜色: #fff; 内边距: 20px; 文本对齐: 居中; 定位: 粘性; 顶部: 0; 层叠顺序: 10; }
    .header h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
    .搜索框 { 最大宽度: 500像素; 外边距: 0 自动; 定位: 相对; 底部外边距: 12像素; }
    .搜索框 输入框 { 宽度: 100%; 内边距: 10px 40px 10px 16px; 边框: 无; 圆角: 25px; 字体大小: 0.95rem; 轮廓: 无; 背景: rgba(255,255,255,0.12); 颜色: #fff; }
    .搜索框 输入框::占位符 { 颜色: rgba(255,255,255,0.55); }
    .tabs { display: flex; justify-content: center; gap: 8px; }
    .tab-btn { background: rgba(255,255,255,0.12); color: #fff; 边框: 无; 内边距: 8像素 20像素; 圆角: 20像素; 字体大小: 0.9rem; 光标: 指针; }
    .tab-btn.active { 背景: #fff; 颜色: #1a1a2e; 字体粗细: 600; }
    .容器 { 最大宽度: 800px; 外边距: 0 自动; 内边距: 20px; }
    .文件列表 { 背景颜色: #fff; 圆角半径: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
    .面包屑 { 内边距: 12px 20px; 下边框: 1px 实线 #f0f0f0; 字体大小: 0.9rem; 颜色: #666; }
    .breadcrumb a { color: #1a1a2e; text-decoration: none; }
    .category-item { display: block; padding: 16px 20px; text-decoration: none; color: #333; border-bottom: 1px solid #f0f0f0; font-size: 1rem; }
    .category-item:hover { background: #f8f9fa; }
    .category-item::before { content: "📁"; margin-right: 10px; }
    .file-item { display: block; padding: 16px 20px; text-decoration: none; color: #333; border-bottom: 1px solid #f0f0f0; font-size: 1rem; }
    .file-item:hover { background: #f8f9fa; }
    .file-item::before { content: "📄"; margin-right: 10px; }
    .notice-item::before { content: "📢"; margin-right: 10px; }
    .back-item { display: block; padding: 12px 20px; text-decoration: none; color: #1a1a2e; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; background: #fafafa; cursor: pointer; }
    .back-item::before { content: "←"; margin-right: 8px; }
    .file-date { color: #aaa; font-size: 0.75rem; margin-left: 8px; }
    .empty { text-align: center; padding: 40px; color: #999; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .error { text-align: center; padding: 40px; color: #e74c3c; }
    .top-tag { background: #ffd700; color: #1a1a2e; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; margin-left: 8px; font-weight: 600; }
    .search-hint { font-size: 0.7rem; color: rgba(255,255,255,0.45); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 Charlie's Cave</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索标题或日期..." autocomplete="off">
    </div>
    <div class="search-hint">支持按日期搜索：2026-08-28、8月28日、2026年8月</div>
    <div class="tabs">
      <button class="tab-btn active" id="tabNotices" onclick="switchTab('notices')">📢 通知</button>
      <button class="tab-btn" id="tabDocs" onclick="switchTab('docs')">📄 文档</button>
    </div>
  </div>
  <div class="container">
    <div id="fileList" class="file-list">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <script>
    const USERNAME = 'HopeuLive';
    const REPO = 'CharlieCave';
    let currentTab = 'notices';
    let currentCategory = '';
    let allItems = [];

    function sortWithPin(items) {
      return items.sort(function(a, b) {
        const nameA = a.name || '';
        const nameB = b.name || '';
        const aTop = nameA.indexOf('⭐') === 0;
        const bTop = nameB.indexOf('⭐') === 0;
        if (aTop && !bTop) return -1;
        if (!aTop && bTop) return 1;
        return nameA.localeCompare(nameB, 'zh-CN', { sensitivity: 'base', numeric: true });
      });
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      const day = d.getDate();
      return y + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
    }

    function parseDateQuery(query) {
      const q = query.trim();
      let year = null, month = null, day = null;
      let matched = false;

      const m1 = q.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (m1) { year = parseInt(m1[1]); month = parseInt(m1[2]); day = parseInt(m1[3]); matched = true; }

      if (!matched) {
        const m2 = q.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
        if (m2) { year = parseInt(m2[1]); month = parseInt(m2[2]); day = parseInt(m2[3]); matched = true; }
      }

      if (!matched) {
        const m3 = q.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日?$/);
        if (m3) { year = parseInt(m3[1]); month = parseInt(m3[2]); day = parseInt(m3[3]); matched = true; }
      }

      if (!matched) {
        const m4 = q.match(/^(\d{1,2})月(\d{1,2})日?$/);
        if (m4) { month = parseInt(m4[1]); day = parseInt(m4[2]); matched = true; }
      }

      if (!matched) {
        const m5 = q.match(/^(\d{4})年?$/);
        if (m5) { year = parseInt(m5[1]); matched = true; }
      }

      if (!matched) {
        const m6 = q.match(/^(\d{1,2})月$/);
        if (m6) { month = parseInt(m6[1]); matched = true; }
      }

      if (!matched) return null;
      return { year: year, month: month, day: day };
    }

    function matchesDate(fileDate, dateQuery) {
      const d = new Date(fileDate);
      if (dateQuery.year !== null && d.getFullYear() !== dateQuery.year) return false;
      if (dateQuery.month !== null && (d.getMonth() + 1) !== dateQuery.month) return false;
      if (dateQuery.day !== null && d.getDate() !== dateQuery.day) return false;
      return true;
    }

    async function fetchPath(path) {
      const response = await fetch('https://api.github.com/repos/' + USERNAME + '/' + REPO + '/contents/' + path);
      if (!response.ok) throw new Error('Failed');
      return await response.json();
    }

    async function fetchAllFilesInPath(path) {
      const items = await fetchPath(path);
      let files = [];
      for (const item of items) {
        if (item.type === 'file' && item.name.toLowerCase().endsWith('.txt')) {
          files.push({
            name: item.name.replace(/\.txt$/i, ''),
            path: item.path,
            date: item.updated_at || item.created_at || ''
          });
        } else if (item.type === 'dir') {
          try {
            const subFiles = await fetchAllFilesInPath(item.path);
            files = files.concat(subFiles);
          } catch (e) {
            // 跳过
          }
        }
      }
      return files;
    }

    async function loadDocs() {
      const container = document.getElementById('fileList');
      container.innerHTML = '<div class="loading">加载中...</div>';
      currentCategory = '';
      try {
        const items = await fetchPath('docs');
        const categories = items.filter(function(f) { return f.type === 'dir'; });
        const rootFiles = items.filter(function(f) { return f.type === 'file' && f.name.toLowerCase().endsWith('.txt'); });

        categories.sort(function(a, b) {
          const aTop = a.name.indexOf('⭐') === 0;
          const bTop = b.name.indexOf('⭐') === 0;
          if (aTop && !bTop) return -1;
          if (!aTop && bTop) return 1;
          return a.name.localeCompare(b.name, 'zh-CN', { sensitivity: 'base', numeric: true });
        });

        const processedRootFiles = rootFiles.map(function(f) {
          return { name: f.name.replace(/\.txt$/i, ''), path: f.path, date: f.updated_at || '', type: 'file' };
        });
        sortWithPin(processedRootFiles);

        allItems = categories.concat(processedRootFiles);

        let html = '';
        categories.forEach(function(cat) {
          const isPinned = cat.name.indexOf('⭐') === 0;
          const displayName = isPinned ? cat.name.substring(2) : cat.name;
          html += '<a class="category-item" href="javascript:void(0)" onclick="openCategory(\'' + encodeURIComponent(cat.name) + '\')">' + escapeHtml(displayName) + (isPinned ? '<span class="top-tag">置顶</span>' : '') + '</a>';
        });
        processedRootFiles.forEach(function(file) {
          const isPinned = file.name.indexOf('⭐') === 0;
          const displayName = isPinned ? file.name.substring(2) : file.name;
          const dateStr = file.date ? formatDate(file.date) : '';
          html += '<a class="file-item" href="/CharlieCave/reader.html?path=' + encodeURIComponent(file.path) + '">' + escapeHtml(displayName) + (isPinned ? '<span class="top-tag">置顶</span>' : '') + (dateStr ? '<span class="file-date">' + dateStr + '</span>' : '') + '</a>';
        });

        if (html === '') html = '<div class="empty">暂无内容</div>';
        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = '<div class="error">加载失败，请刷新重试</div>';
      }
    }

    async function openCategory(catName) {
      currentCategory = decodeURIComponent(catName);
      const container = document.getElementById('fileList');
      container.innerHTML = '<div class="loading">加载中...</div>';
      try {
        const files = await fetchAllFilesInPath('docs/' + currentCategory);
        sortWithPin(files);
        所有项 = 文件;

        const isCatPinned = currentCategory.indexOf('⭐') === 0;
        const catDisplayName = isCatPinned ? currentCategory.substring(2) : currentCategory;

        let html = '<div class="breadcrumb"><a href="javascript:void(0)" onclick="loadDocs()">📄 文档</a> / ' + escapeHtml(catDisplayName) + '</div>';
        html += '<a class="back-item" href="javascript:void(0)" onclick="loadDocs()">返回分类列表</a>';

        if (files.length === 0) {
          html += '<div class="empty">此分类下暂无文档</div>';
        } 否则 {
          files.forEach(function(file) {
            const isPinned = file.name.indexOf('⭐') === 0;
            const displayName = isPinned ? file.name.substring(2) : file.name;
            const dateStr = file.date ? formatDate(file.date) : '';
            html += '<a class="file-item" href="/CharlieCave/reader.html?path=' + encodeURIComponent(file.path) + '">' + escapeHtml(displayName) + (isPinned ? '<span class="top-tag">置顶</span>' : '') + (dateStr ? '<span class="file-date">' + dateStr + '</span>' : '') + '</a>';
          });
        }

        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = '<div class="error">加载失败，请刷新重试</div>';
      }
    }

    async function loadNotices() {
      const container = document.getElementById('fileList');
      container.innerHTML = '<div class="loading">加载中...</div>';
      try {
        const files = await fetchAllFilesInPath('notices');
        sortWithPin(files);
        allItems = files;
        renderFlatList(files, true);
      } catch (error) {
        container.innerHTML = '<div class="error">加载失败，请刷新重试</div>';
      }
    }

    function renderFlatList(files, isNotice) {
      const container = document.getElementById('fileList');
      if (files.length === 0) {
        container.innerHTML = '<div class="empty">暂无内容</div>';
        return;
      }
      let html = '';
      files.forEach(function(file) {
        const isPinned = file.name.indexOf('⭐') === 0;
        const displayName = isPinned ? file.name.substring(2) : file.name;
        const cls = isNotice ? 'file-item notice-item' : 'file-item';
        const dateStr = file.date ? formatDate(file.date) : '';
        html += '<a class="' + cls + '" href="/CharlieCave/reader.html?path=' + encodeURIComponent(file.path) + '">' + escapeHtml(displayName) + (isPinned ? '<span class="top-tag">置顶</span>' : '') + (dateStr ? '<span class="file-date">' + dateStr + '</span>' : '') + '</a>';
      });
      container.innerHTML = html;
    }

    函数 切换选项卡(tab) {
      currentTab = tab;
      currentCategory = '';
      文档.getElementById('tabNotices').类名 = tab === 'notices' ? 'tab-btn active' : 'tab-btn';
      文档.getElementById('tabDocs').className = tab === 'docs' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('searchInput').value = '';
      if (tab === 'docs') { loadDocs(); } else { loadNotices(); }
    }

    函数 escapeHtml(文本) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    文档.getElementById('searchInput').addEventListener('input', 函数(e) {
      const q = e.target.value.trim();
      如果 (!q) {
        如果 (当前选项卡 === '文档' && !当前分类) { 加载文档(); }
        否则 如果 (当前选项卡 === '文档' && 当前分类) { 打开分类(当前分类); }
        else { loadNotices(); }
        return;
      }

      const dateQuery = parseDateQuery(q);
      let results;

      if (dateQuery) {
        results = allItems.filter(function(f) {
          返回 f.日期 && 匹配日期(f.日期, 日期查询);
        });
      } 否则 {
        const lowerQ = q.toLowerCase();
        results = allItems.filter(function(f) {
          const name = (f.name || '').toLowerCase();
          返回 name.indexOf(lowerQ) !== -1;
        });
      }

      const container = document.getElementById('fileList');
      如果 (results.length === 0) { container.innerHTML = '<div class="empty">未找到匹配内容</div>'; 返回; }

      let html = '';
      results.forEach(function(item) {
        如果 (项.类型 === '目录') {
          const isPinned = item.name.indexOf('⭐') === 0;
          const displayName = isPinned ? item.name.substring(2) : item.name;
          html += '<a class="category-item" href="javascript:void(0)" onclick="openCategory(\'' + encodeURIComponent(item.name) + '\')">' + escapeHtml(displayName) + (isPinned ? '<span class="top-tag">置顶</span>' : '') + '</a>';
        } 否则 {
          const isNotice = currentTab === 'notices';
          const cls = isNotice ? 'file-item notice-item' : 'file-item';
          const isPinned = (item.name || '').indexOf('⭐') === 0;
          const displayName = isPinned ? (item.name || '').substring(2) : (item.name || '');
          const dateStr = item.date ? formatDate(item.date) : '';
          html += '<a class="' + cls + '" href="/CharlieCave/reader.html?path=' + encodeURIComponent(item.path) + '">' + escapeHtml(displayName) + (isPinned ? '<span class="top-tag">置顶</span>' : '') + (dateStr ? '<span class="file-date">' + dateStr + '</span>' : '') + '</a>';
        }
      });
      container.innerHTML = html;
    });

    loadNotices();
  </script>
</body>
</html>
