<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlie's Cave</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; min-height: 100vh; }
    .header { background: #1a1a2e; color: #fff; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 10; }
    .header h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
    .search-box { max-width: 500px; margin: 0 auto; position: relative; margin-bottom: 12px; }
    .search-box input { width: 100%; padding: 10px 40px 10px 16px; border: none; border-radius: 25px; font-size: 0.95rem; outline: none; background: rgba(255,255,255,0.12); color: #fff; }
    .search-box input::placeholder { color: rgba(255,255,255,0.55); }
    .tabs { display: flex; justify-content: center; gap: 8px; }
    .tab-btn { background: rgba(255,255,255,0.12); color: #fff; border: none; padding: 8px 20px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; }
    .tab-btn.active { background: #fff; color: #1a1a2e; font-weight: 600; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .file-list { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
    .file-item { display: block; padding: 16px 20px; text-decoration: none; color: #333; border-bottom: 1px solid #f0f0f0; font-size: 1rem; }
    .file-item:hover { background: #f8f9fa; }
    .file-item::before { content: "📄"; margin-right: 10px; }
    .notice-item::before { content: "📢"; margin-right: 10px; }
    .file-date { color: #aaa; font-size: 0.75rem; margin-left: 8px; }
    .empty { text-align: center; padding: 40px; color: #999; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .error { text-align: center; padding: 40px; color: #e74c3c; }
    .top-tag { background: #ffd700; color: #1a1a2e; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; margin-left: 8px; font-weight: 600; }
    .search-hint { font-size: 0.7rem; color: rgba(255,255,255,0.45); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 Charlie's Cave</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索标题或日期（如 2026-08-28）..." autocomplete="off">
    </div>
    <div class="search-hint">支持按日期搜索：2026-08-28、8月28日、2026年8月</div>
    <div class="tabs">
      <button class="tab-btn active" id="tabDocs" onclick="switchTab('docs')">📄 文档</button>
      <button class="tab-btn" id="tabNotices" onclick="switchTab('notices')">📢 通知</button>
    </div>
  </div>
  <div class="container">
    <div id="fileList" class="file-list">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <script>
    const USERNAME = 'HopeuLive';
    const REPO = 'CharlieCave';
    let currentTab = 'docs';
    let allItems = [];

    function sortWithPin(items) {
      return items.sort(function(a, b) {
        const nameA = a.name || '';
        const nameB = b.name || '';
        const aTop = nameA.indexOf('⭐') === 0;
        const bTop = nameB.indexOf('⭐') === 0;
        if (aTop && !bTop) return -1;
        if (!aTop && bTop) return 1;
        return nameA.localeCompare(nameB, 'zh-CN', { sensitivity: 'base', numeric: true });
      });
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      const day = d.getDate();
      return y + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
    }

    function parseDateQuery(query) {
      const q = query.trim();
      let year = null, month = null, day = null;
      let matched = false;

      const m1 = q.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (m1) { year = parseInt(m1[1]); month = parseInt(m1[2]); day = parseInt(m1[3]); matched = true; }

      if (!matched) {
        const m2 = q.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
        if (m2) { year = parseInt(m2[1]); month = parseInt(m2[2]); day = parseInt(m2[3]); matched = true; }
      }

      if (!matched) {
        const m3 = q.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日?$/);
        if (m3) { year = parseInt(m3[1]); month = parseInt(m3[2]); day = parseInt(m3[3]); matched = true; }
      }

      if (!matched) {
        const m4 = q.match(/^(\d{1,2})月(\d{1,2})日?$/);
        if (m4) { month = parseInt(m4[1]); day = parseInt(m4[2]); matched = true; }
      }

      if (!matched) {
        const m5 = q.match(/^(\d{4})年?$/);
        if (m5) { year = parseInt(m5[1]); matched = true; }
      }

      if (!matched) {
        const m6 = q.match(/^(\d{1,2})月$/);
        if (m6) { month = parseInt(m6[1]); matched = true; }
      }

      if (!matched) return null;
      return { year: year, month: month, day: day };
    }

    function matchesDate(fileDate, dateQuery) {
      const d = new Date(fileDate);
      if (dateQuery.year !== null && d.getFullYear() !== dateQuery.year) return false;
      if (dateQuery.month !== null && (d.getMonth() + 1) !== dateQuery.month) return false;
      if (dateQuery.day !== null && d.getDate() !== dateQuery.day) return false;
      return true;
    }

    async function fetchAllFiles(path) {
      const response = await fetch('https://api.github.com/repos/' + USERNAME + '/' + REPO + '/contents/' + path);
      if (!response.ok) throw new Error('Failed');
      const items = await response.json();
      let files = [];
      for (const item of items) {
        if (item.type === 'file' && item.name.toLowerCase().endsWith('.txt')) {
          files.push({
            name: item.name.replace(/\.txt$/i, ''),
            path: item.path,
            date: item.updated_at || item.created_at || ''
          });
        } else if (item.type === 'dir') {
          try {
            const subFiles = await fetchAllFiles(item.path);
            files = files.concat(subFiles);
          } catch (e) {
            // 跳过读取失败的子文件夹
          }
        }
      }
      return files;
    }

    async function loadDocs() {
      const container = document.getElementById('fileList');
      container.innerHTML = '<div class="loading">加载中...</div>';
      try {
        const files = await fetchAllFiles('docs');
        sortWithPin(files);
        allItems = files;
        renderList(files, false);
      } catch (error) {
        container.innerHTML = '<div class="error">加载失败，请刷新重试</div>';
      }
    }

    async function loadNotices() {
      const container = document.getElementById('fileList');
      container.innerHTML = '<div class="loading">加载中...</div>';
      try {
        const files = await fetchAllFiles('notices');
        sortWithPin(files);
        allItems = files;
        renderList(files, true);
      } catch (error) {
        container.innerHTML = '<div class="error">加载失败，请刷新重试</div>';
      }
    }

    function renderList(files, isNotice) {
      const container = document.getElementById('fileList');
      if (files.length === 0) {
        container.innerHTML = '<div class="empty">暂无内容</div>';
        return;
      }
      let html = '';
      files.forEach(function(file) {
        const isPinned = file.name.indexOf('⭐') === 0;
        const displayName = isPinned ? file.name.substring(2) : file.name;
        const cls = isNotice ? 'file-item notice-item' : 'file-item';
        const dateStr = file.date ? formatDate(file.date) : '';
        html += '<a class="' + cls + '" href="/CharlieCave/reader.html?path=' + encodeURIComponent(file.path) + '">' + escapeHtml(displayName) + (isPinned ? '<span class="top-tag">置顶</span>' : '') + (dateStr ? '<span class="file-date">' + dateStr + '</span>' : '') + '</a>';
      });
      container.innerHTML = html;
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabDocs').className = tab === 'docs' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tabNotices').className = tab === 'notices' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('searchInput').value = '';
      if (tab === 'docs') { loadDocs(); } else { loadNotices(); }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const q = e.target.value.trim();
      if (!q) {
        if (currentTab === 'docs') { loadDocs(); } else { loadNotices(); }
        return;
      }

      const dateQuery = parseDateQuery(q);
      let results;

      if (dateQuery) {
        results = allItems.filter(function(f) {
          return f.date && matchesDate(f.date, dateQuery);
        });
      } else {
        const lowerQ = q.toLowerCase();
        results = allItems.filter(function(f) {
          return f.name.toLowerCase().indexOf(lowerQ) !== -1;
        });
      }

      renderList(results, currentTab === 'notices');
    });

    loadDocs();
  </script>
</body>
</html>
